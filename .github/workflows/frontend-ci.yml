name: Frontend CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Validate Frontend Client
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./rap chieu phim/frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './rap chieu phim/frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build
