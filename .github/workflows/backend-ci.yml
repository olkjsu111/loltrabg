name: Backend CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    name: Verify Backend Syntax & Dependencies
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./rap chieu phim/backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './rap chieu phim/backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Check JavaScript Syntax of Entry Point
        run: node -c server.js
